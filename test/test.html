<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Test</title>
</head>
<body>
  <h2>Login Test Page</h2>

  <form id="loginForm">
    <input type="text" id="phone" placeholder="Phone" required /><br /><br />
    <input type="password" id="password" placeholder="Password" required /><br /><br />
    <button type="submit">Login</button>
  </form>

  <button id="checkSessionBtn">Check Session (/me)</button>
  <pre id="output"></pre>

  <script>
    const form = document.getElementById('loginForm');
    const output = document.getElementById('output');
    const checkSessionBtn = document.getElementById('checkSessionBtn');

    // Login
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          credentials: 'include', // important for session cookies
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const data = await res.json();
        output.textContent = "Login Response:\n" + JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = 'Login Error: ' + err.message;
      }
    });

    // Check session (/me)
    checkSessionBtn.addEventListener('click', async () => {
      try {
        const res = await fetch('http://localhost:3000/api/auth/me', {
          method: 'GET',
          credentials: 'include', // important for session cookies
        });
        const data = await res.json();
        output.textContent = "/me Response:\n" + JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = '/me Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
